<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Become AI Native Banner</title>

    <!-- Подключение Roboto, как в основном проекте -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />

    <style>
      /* Базовый сброс стилей */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body,
      html {
        width: 300px;
        height: 600px;
        overflow: hidden;
        font-family: 'Roboto', sans-serif;
        background-color: #000000;
        outline: none;
      }

      /* Сброс обводок фокуса */
      a,
      a:focus,
      a:active,
      *:focus {
        outline: none !important;
        -webkit-tap-highlight-color: transparent;
      }

      /* Контейнер баннера */
      .banner-container {
        width: 300px;
        height: 600px;
        position: relative;
        overflow: hidden;
        border: none;
        border-radius: 16px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 32px 18px;
        cursor: pointer;
        user-select: none;
        outline: none;
      }

      /* Фоновое изображение со сгенерированной картинкой */
      .banner-bg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0.9;
        z-index: 1;
        transition:
          transform 0.8s cubic-bezier(0.16, 1, 0.3, 1),
          opacity 0.8s ease;
      }

      .banner-container:hover .banner-bg {
        transform: scale(1.05);
        opacity: 0.9;
      }

      /* Градиентное наложение для читаемости */
      .banner-overlay {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 312px;
        background: linear-gradient(
          to top,
          rgba(0, 0, 0, 0.95) 0%,
          rgba(0, 0, 0, 0.7) 70%,
          rgba(0, 0, 0, 0.3) 80%,
          rgba(0, 0, 0, 0) 100%
        ) !important;
        z-index: 5 !important;
        pointer-events: none;
        transform: translateZ(0);
        -webkit-transform: translateZ(0);
      }

      /* Анимация появления */
      @keyframes fadeSlideIn {
        from {
          opacity: 0;
          transform: translateY(15px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .animate-item {
        opacity: 0;
        animation: fadeSlideIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        position: relative;
        z-index: 3;
      }

      .delay-1 {
        animation-delay: 150ms;
      }
      .delay-2 {
        animation-delay: 350ms;
      }
      .delay-3 {
        animation-delay: 550ms;
      }
      .delay-4 {
        animation-delay: 750ms;
      }

      /* Верхняя плашка (Надпись) */
      .brand-tag {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
        position: relative;
        z-index: 10;
        transform: translateZ(0);
        -webkit-transform: translateZ(0);
      }

      .brand-tag span {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        color: #f4d03f;
        text-shadow: 0 0 15px rgba(244, 208, 63, 0.4);
      }

      .brand-line {
        height: 2px;
        width: 32px;
        background-color: #f4d03f;
        border-radius: 9999px;
        box-shadow: 0 0 10px rgba(244, 208, 63, 0.5);
      }

      /* Контентная часть */
      .content-area {
        display: flex;
        flex-direction: column;
        gap: 16px;
        margin-top: auto;
        position: relative;
        z-index: 10;
        transform: translateZ(0);
        -webkit-transform: translateZ(0);
      }

      .headline {
        font-size: 19px;
        font-weight: 700;
        line-height: 1.2;
        color: #ffffff;
        letter-spacing: -0.02em;
        white-space: nowrap !important;
      }

      .description {
        font-size: 13px;
        font-weight: 400;
        line-height: 1.5;
        color: #d1d5db;
      }

      /* Кнопка CTA */
      .cta-btn {
        width: 100%;
        margin-top: 8px;
        padding: 16px 20px;
        background-color: #f4d03f;
        border: none;
        outline: none;
        color: #333333;
        font-weight: 700;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        transition:
          background-color 0.3s,
          transform 0.3s,
          box-shadow 0.3s;
        z-index: 3;
      }

      /* Анимация пульсации кнопки */
      @keyframes ctaPulse {
        0% {
          transform: scale(1);
          box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        50% {
          transform: scale(1.02);
          box-shadow: 0 0 18px rgba(244, 208, 63, 0.5);
        }
        100% {
          transform: scale(1);
          box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
      }

      /* Применяем пульсацию к кнопке после появления всего баннера */
      .cta-pulse-animation {
        animation: ctaPulse 3s ease-in-out infinite;
        animation-delay: 1.5s;
      }

      .banner-container:hover .cta-btn {
        animation: none; /* останавливаем автопульсацию при ховере */
        transform: translateY(-2px) scale(1.02);
        box-shadow: 0 0 22px rgba(244, 208, 63, 0.7);
        background-color: #f5d757;
      }

      /* Эффект проходящего блика (shimmer) */
      @keyframes shimmer {
        0% {
          left: -150%;
        }
        50% {
          left: 150%;
        }
        100% {
          left: 150%;
        }
      }

      .cta-btn::after {
        content: '';
        position: absolute;
        top: 0;
        left: -150%;
        width: 50%;
        height: 100%;
        background: linear-gradient(
          to right,
          rgba(255, 255, 255, 0) 0%,
          rgba(255, 255, 255, 0.35) 50%,
          rgba(255, 255, 255, 0) 100%
        );
        transform: skewX(-25deg);
        animation: shimmer 5s infinite;
        animation-delay: 2s;
      }

      /* Иконка стрелочки */
      .arrow-icon {
        stroke-width: 3px;
        transition: transform 0.3s;
      }

      .banner-container:hover .arrow-icon {
        transform: translateX(3px);
      }
    </style>

    <script>
      // Стандартное определение clickTag для рекламных сетей
      var clickTag = 'https://proshinsky.com';
    </script>
  </head>
  <body>
    <!-- Обертка clickTag для трекинга кликов в рекламных сетях -->
    <a
      href="javascript:void(window.open(clickTag))"
      id="banner-link"
      style="text-decoration: none; display: block; width: 100%; height: 100%"
    >
      <div class="banner-container">
        <!-- Фоновая картинка -->
        <img src="bg.jpg" alt="AI Consulting" class="banner-bg" />

        <!-- Градиентное затемнение -->
        <div class="banner-overlay"></div>

        <!-- Логотип сверху -->
        <div class="brand-tag animate-item delay-1">
          <span>become ai native</span>
          <div class="brand-line"></div>
        </div>

        <!-- Контент снизу -->
        <div class="content-area">
          <h3 class="headline animate-item delay-2" id="headline">Увеличьте прибыль с ИИ</h3>
          <p class="description animate-item delay-3" id="description">
            Проведем аудит ваших процессов и покажем где ИИ даст наибольший прирост метрик.
          </p>

          <div class="animate-item delay-4" style="width: 100%">
            <button class="cta-btn cta-pulse-animation" id="cta-button">
              <span id="cta-text">Записаться на аудит</span>
              <svg
                class="arrow-icon"
                xmlns="http://www.w3.org/2000/svg"
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M5 12h14" />
                <path d="m12 5 7 7-7 7" />
              </svg>
            </button>
          </div>
        </div>
      </div>
    </a>

    <script>
      // Динамическая локализация баннера на основе URL-параметра lang
      const urlParams = new URLSearchParams(window.location.search);
      const lang = urlParams.get('lang') || 'ru';

      const translations = {
        ru: {
          headline: 'Увеличьте прибыль с ИИ',
          description:
            'Проведем аудит ваших процессов и покажем где ИИ даст наибольший прирост метрик.',
          cta: 'Записаться на аудит',
        },
        en: {
          headline: 'Increase Profits with AI',
          description:
            'We will audit your processes and show where AI will deliver the highest metric growth.',
          cta: 'Book Free Audit',
        },
      };

      const t = translations[lang === 'en' ? 'en' : 'ru'];
      document.getElementById('headline').textContent = t.headline;
      document.getElementById('description').textContent = t.description;
      document.getElementById('cta-text').textContent = t.cta;

      // Взаимодействие с родительским окном для открытия BookingModal
      document.getElementById('banner-link').addEventListener('click', function (e) {
        // Предотвращаем открытие ссылки, если мы хотим использовать внутренний BookingModal
        e.preventDefault();

        // Отправка сообщения в родительское окно
        if (window.parent) {
          window.parent.postMessage('openBooking', '*');
        }
      });
    </script>
  </body>
</html>
